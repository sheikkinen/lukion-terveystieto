<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="15"><title>Terveyden taustatekijöiden neljä tasoa</title><desc>Sisäkkäiset kehät, joissa keskellä on yksilö. Yksilöllisiä tekijöitä ovat perimä, ikä, elintavat, tiedot ja taidot. Niitä ympäröivät yhteisölliset tekijät eli perhe, ystävät, koulu, harrastukset ja työpaikka. Seuraavana ovat yhteiskunnalliset tekijät eli koulutus, toimeentulo, asuminen, lait ja palvelut. Uloimpana ovat globaalit tekijät eli ilmasto, ympäristö, maailmantalous, kriisit ja tartuntataudit. Sama tekijä voi suojata tai kuormittaa.</desc><rect x="2" y="2" width="356" height="456" rx="14" fill="#fbf3f0" stroke="#9a5a4a" stroke-width="1.5"/><text x="180.0" y="31" text-anchor="middle" font-weight="700" fill="#1a1a1a">Globaalit tekijät</text><text x="180.0" y="51" text-anchor="middle" fill="#1a1a1a">ilmasto, ympäristö,</text><text x="180.0" y="71" text-anchor="middle" fill="#1a1a1a">maailmantalous,</text><text x="180.0" y="91" text-anchor="middle" fill="#1a1a1a">kriisit ja tartuntataudit</text><rect x="16" y="104" width="328" height="340" rx="14" fill="#faf6ee" stroke="#8a6a3d" stroke-width="1.5"/><text x="180.0" y="133" text-anchor="middle" font-weight="700" fill="#1a1a1a">Yhteiskunnalliset tekijät</text><text x="180.0" y="153" text-anchor="middle" fill="#1a1a1a">koulutus, toimeentulo,</text><text x="180.0" y="173" text-anchor="middle" fill="#1a1a1a">asuminen,</text><text x="180.0" y="193" text-anchor="middle" fill="#1a1a1a">lait ja palvelut</text><rect x="30" y="206" width="300" height="224" rx="14" fill="#f3f6fb" stroke="#3d5f8a" stroke-width="1.5"/><text x="180.0" y="235" text-anchor="middle" font-weight="700" fill="#1a1a1a">Yhteisölliset tekijät</text><text x="180.0" y="255" text-anchor="middle" fill="#1a1a1a">perhe, ystävät, koulu,</text><text x="180.0" y="275" text-anchor="middle" fill="#1a1a1a">harrastukset</text><text x="180.0" y="295" text-anchor="middle" fill="#1a1a1a">ja työpaikka</text><rect x="44" y="308" width="272" height="108" rx="14" fill="#e3f0ee" stroke="#2f6f6a" stroke-width="1.5"/><text x="180.0" y="337" text-anchor="middle" font-weight="700" fill="#1a1a1a">Yksilölliset tekijät</text><text x="180.0" y="357" text-anchor="middle" fill="#1a1a1a">perimä, ikä,</text><text x="180.0" y="377" text-anchor="middle" fill="#1a1a1a">elintavat,</text><text x="180.0" y="397" text-anchor="middle" fill="#1a1a1a">tiedot ja taidot</text></svg>