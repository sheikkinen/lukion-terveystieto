# Linkitetyt materiaalit per TE1-aihe. Linkit, ei kopioita (CLAUDE.md sääntö 5). Tuotettu front matterista; älä muokkaa käsin ilman uutta ajoa.
checked: '2026-11-21'
note: 'Luettelo on tuotettu aiheiden front matterista: jokaisesta aiheesta kaikki osoitteet kentistä official_links, materials ja sibling_links, yksi merkintä per osoite (listed_in kertoo kentät), lisenssiluokka ja lukupäivä aiheen omasta merkinnästä. Jos osoitteella ei ole materials-merkintää, sibling_links-osoite on CC BY 4.0 (sisarsivusto) ja muu osoite link-out. Link-out-aineisto vain linkitetään (sääntö 5). Kenttä note on siirretty aiemmista merkinnöistä; vain niiden osoitteiden avaaminen 2026-11-21 (enintään kaksi yritystä), aoe.fi-rajapintatarkistus ja aoe.fi-metatietojen lisenssit on todennettu, joiden note sanoo niin. Luettelo ei kata aiheiden leipätekstin linkkejä. Lista excluded on pelkkä kirjaus eikä tule näkyviin. TE2-aiheet (te2-01...te2-10) on lisätty 2026-11-21 tietoagentin ajossa kriitikon linkkiluettelosta (docs/research/2026-11-21-te2-scouting.json): jokainen osoite avattu ja tarkistettu (Python, kaksi yritystä), aoe.fi-lisenssit aoe.fi-rajapinnasta, Tieteen termipankin lisenssi sivun alatunnisteesta. Avunlinkit (opiskelijoille) on merkitty sarakkeessa audience; vain nuorille osoitetut palvelut kuuluvat opiskelijan Apua ja tukea -osioon. Aiheiden front matter on lopullinen lähde: kirjoittajat poimivat sieltä linkit, ja luettelo ajetaan uudelleen front matterista.'
