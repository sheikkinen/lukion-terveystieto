      gentle reflections on the water. A peaceful, safe and caring mood.
    alt: >-
      Kaksi ystävää istuu laiturilla tyynen järven rannalla, ja toinen kuuntelee toista rauhallisesti.

  - id: il-te1-09-stressi-ja-kriisit
    kind: illustration
    model: p-image
    aspect: "16:9"
    page: te1-09-stressi-ja-kriisit
    placement: header
    decorative: true
    prompt: >-
      A student has stepped away from a desk with neatly stacked blank books and stretches calmly by an open
      window, looking out at green trees and soft clouds with a relaxed face; a houseplant on the windowsill, a
      friend waves from the doorway inviting them for a walk. A sense of taking a break and recovering, light and
      airy.
    alt: >-
      Opiskelija pitää taukoa ja venyttelee avoimen ikkunan ääressä, ja ystävä kutsuu hänet kävelylle.

  - id: il-te1-10-opiskeluhyvinvointi
    kind: illustration
    model: p-image
    aspect: "16:9"
    page: te1-10-opiskeluhyvinvointi
    placement: header
    decorative: true
    prompt: >-
      A calm, light school study space with large windows and plants: a few students study at a long table, one
