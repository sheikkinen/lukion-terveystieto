    module: TE
    text: pystyy luomaan kokonaiskuvaa terveydestä ja sen yksilöllisistä, yhteisöllisistä, yhteiskunnallisista ja globaaleista edellytyksistä, pystyy tekemään perusteltuja ehdotuksia siitä, miten omaa, muiden ihmisten sekä ympäristön terveyttä ja turvallisuutta voidaan ylläpitää tai edistää, sekä osaa käyttää terveystiedon käsitteitä asianmukaisesti
  TE.yt2:
    kind: yleinen_tavoite
    module: TE
    text: osaa hakea tietoa eri lähteistä, soveltaa ja analysoida terveyteen liittyvää tietoa sekä arvioida tiedon luotettavuutta ja pätevyyttä, ymmärtää tieteellisen tiedon ja arkitiedon eron terveyden ja sairauksien riskien, syiden, vaikutusmekanismien ja seurausten selittämisessä sekä osaa perustella näkemyksiään tutkimustiedon avulla
  TE.yt3:
