    model: nano-banana
    fallback: svg
    aspect: "4:5"
    page: te1-08-mielenterveys
    placement: Opiskelijalle
    prompt: "Mermaid source content/diagrams/dg-suojaavat-tekijat.mmd, rendered to site-src/img/dg-suojaavat-tekijat.svg."
    alt: >-
      Kaavio mielenterveyttä suojaavista tekijöistä kolmena allekkaisena laatikkona, yksi kullekin tasolle. Yksilölliset tekijät: tunteiden säätely,
      ongelmanratkaisutaidot, myönteinen käsitys itsestä, kyky pyytää apua ja merkitykselliseksi koettu tekeminen.
