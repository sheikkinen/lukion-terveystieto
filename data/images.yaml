  - id: dg-hypnogrammi
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "5:2"
    page: te1-05-liikunta-ja-uni
    placement: Opiskelijalle
    prompt: >-
      Vega-Lite spec data/charts/dg-hypnogrammi.vl.json (self-made schematic data, no clock hours, no measurements),
      rendered with vl-convert-python to site-src/img/dg-hypnogrammi.svg, Vega's ARIA labels off.
    alt: >-
      Kaaviomainen hypnogrammi, ei mittausdataa. Porrasviiva kulkee viiden unijakson läpi univaiheiden välillä:
      valve, REM vilkeuni, N1 torke, N2 kevyt uni ja N3 syvä uni. Yö alkaa valveesta ja torkkeesta. Kahdessa
      ensimmäisessä jaksossa syvää unta on pitkään, kolmannessa lyhyesti ja kahdessa viimeisessä ei lainkaan.
      Vilkeunijaksot pitenevät aamua kohti, ja yö päättyy heräämiseen. Syvä uni painottuu alkuyöhön ja vilkeuni
      loppuyöhön.
    expected_labels:
      - "Hypnogrammi: univaiheet yön mittaan"
      - "Kaaviomainen esimerkki, ei mittausdataa"
      - "Univaihe"
      - "Valve"
      - "REM vilkeuni"
      - "N1 torke"
      - "N2 kevyt uni"
      - "N3 syvä uni"
      - "Yön kulku, viisi unijaksoa"
      - "alku"
      - "loppu"
    facts_from:
      - {topic: te1-05-liikunta-ja-uni, section: "Opiskelijalle / Uni ja unen vaiheet (taulukko; syvä uni alkuyöhön, vilkeuni loppuyöhön)"}

  - id: dg-suojaavat-tekijat
