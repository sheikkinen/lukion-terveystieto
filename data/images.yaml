    expected_labels:
      - "Lue osio Opiskelijalle"
      - "Tee tehtävät"
      - "Harjoittele koetehtävää"
      - "Tarkista mallivastauksella"
      - "Pohdi ja arvioi itse"
      - "Seuraava askel"
      - "seuraava aihe"
    facts_from:
      - {topic: te1-01-terveys-voimavarana, section: "Itseopiskelun askel / Näin etenet"}
      - {topic: polku, section: "content/pages/polku.md (luet, teet, harjoittelet, tarkistat, pohdit, seuraava askel)"}

  - id: dg-muutosvaihemalli
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "9:16"
    page: te1-02-elintapamallit
    placement: Opiskelijalle
    prompt: "Mermaid source content/diagrams/dg-muutosvaihemalli.mmd, rendered to site-src/img/dg-muutosvaihemalli.svg."
