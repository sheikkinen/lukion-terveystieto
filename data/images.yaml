      - "koulussa ja harrastuksissa"
      - "Yhteiskunnalliset tekijät"
      - "opiskeluhuolto ja muut matalan kynnyksen"
      - "palvelut, riittävä toimeentulo, turvallinen"
      - "asuinympäristö, kiusaamisen ja syrjinnän"
