# Picture plan for brief 007 (art director, 2026-11-21). Read by lukio-runko (pictures.py: build placement;
# images.py: generation). This file holds the style line and the diagrams; data/images-illustrations.yaml holds the
# illustrations.
#
# Diagrams are not drawn by an image model (D-006, brief 007 addenda). The Mermaid sources are in
# content/diagrams/<id>.mmd and the hypnogram is the Vega-Lite spec data/charts/dg-hypnogrammi.vl.json. They are rendered
# to site-src/img/<id>.svg before the build. `fallback: svg` tells the image tool to skip them, and `model` is kept
# only because the schema requires it. `prompt` records where the source is.
# Diagrams carry information: alt is the full description. expected_labels are the exact text strings of the SVG,
# one per rendered line (a label with a line break is listed line by line). facts_from names the topic section the
# wording comes from. Placement: the H2 section the diagram follows (the lesson view shows diagrams in one place).

style: >-
  Calm, friendly flat editorial illustration with soft simple shapes, gentle grain-free shading and clean edges.
  Soft limited palette of muted teal, warm sand, pale sky blue, soft coral and deep slate on an off-white
  background, in the spirit of a calm Nordic school website. Light, airy composition with generous empty space.
  Young people of about 16 to 19 of varied genders, skin tones, body types, abilities and backgrounds, natural
  relaxed poses, simple calm friendly faces, everyday casual clothes, no school uniforms. Fictional people only, no
  real people, no celebrities. No scales, measuring tapes, food portions, drinks in glasses, cigarettes, vapes,
  pills, medical equipment, hospitals, injuries or worried faces. Absolutely no text, letters, numbers, words,
  signs, logos, brand marks or watermarks anywhere; any screens, books, papers and boards are blank or show only
  simple abstract shapes.

images:

