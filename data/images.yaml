  - id: dg-stressiketju
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "9:16"
    page: te1-09-stressi-ja-kriisit
    placement: Opiskelijalle
    prompt: "Mermaid source content/diagrams/dg-stressiketju.mmd, rendered to site-src/img/dg-stressiketju.svg."
    alt: >-
      Kaavio siitä, miten kuormitus kasautuu. Ketju etenee: vaatimukset, arvio vaatimuksista ja voimavaroista,
