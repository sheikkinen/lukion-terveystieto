    prompt: "Mermaid source content/diagrams/dg-itseopiskelun-askel.mmd, rendered to site-src/img/dg-itseopiskelun-askel.svg."
    alt: >-
      Kaavio itseopiskelun askeleesta. Nuolet etenevät järjestyksessä: lue osio Opiskelijalle, tee tehtävät,
      harjoittele koetehtävää, tarkista mallivastauksella, pohdi ja arvioi itse, seuraava askel. Seuraavasta
