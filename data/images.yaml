    page: te1-01-terveys-voimavarana
    placement: Opiskelijalle
    prompt: "Mermaid source content/diagrams/dg-ottawa.mmd, rendered to site-src/img/dg-ottawa.svg."
    alt: >-
      Kaavio Ottawan asiakirjan (WHO 1986) viidestä terveyden edistämisen toiminta-alueesta. Vasemmalla olevasta
      terveyden edistämisestä lähtee nuoli viiteen allekkaiseen laatikkoon: terveyttä edistävä
      yhteiskuntapolitiikka, terveyttä tukevat ympäristöt, yhteisön toiminta, henkilökohtaiset taidot ja terveyspalvelujen suuntaaminen uudelleen.
    expected_labels:
      - "Terveyden"
      - "edistäminen"
      - "(Ottawan"
      - "asiakirja 1986)"
      - "Terveyttä edistävä"
      - "yhteiskuntapolitiikka"
      - "Terveyttä tukevat"
      - "ympäristöt"
      - "Yhteisön"
      - "toiminta"
      - "Henkilökohtaiset"
      - "taidot"
      - "Terveyspalvelujen"
      - "suuntaaminen"
      - "uudelleen"
    facts_from:
      - {topic: te1-01-terveys-voimavarana, section: "Opiskelijalle / Ottawan asiakirjan viisi toiminta-aluetta"}

  - id: dg-itseopiskelun-askel
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "9:16"
    page: te1-01-terveys-voimavarana
